<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card shadow-sm border-0 rounded-3" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4 p-md-5">
      <h3 class="text-center mb-2">Welcome Back</h3>
      <p class="text-muted text-center mb-4">Please sign in to your account</p>

      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />
            <label class="form-check-label" for="remember">
              Remember me
            </label>
          </div>
          <a routerLink="/forgot-password" class="text-decoration-none small" href="#">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Login
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Don't have an account?
        <a routerLink="/register" href="#" class="text-decoration-none">Register</a>
      </p>
    </div>
  </div>
</div>
