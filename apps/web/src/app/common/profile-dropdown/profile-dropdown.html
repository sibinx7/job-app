<div class="dropdown">
  <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Profile</a>
  <ul class="dropdown-menu dropdown-menu-end profile-dropdown-menu">
    <!-- Profile Information with Profile image-->
    <li class="profile-dropdown-menu-item-profile">
      <div class="profile-info">
        <div class="profile-info-avatar me-3">
          @if(user?.profile_image){
          <img src="{{ user?.profile_image }}" alt="Profile">
          }
          @else {
          <app-profile-avatar [fullName]="fullName"></app-profile-avatar>
          }
        </div>
        <div class="profile-info-details">
          <h5>{{ fullName }}</h5>
          <p>{{ role() }}</p>
        </div>
      </div>
    </li>
    <!-- End Profile information with Profile image-->
    <li>
      <hr class="dropdown-divider">
    </li>
    <li class="profile-dropdown-menu-item">
      <a [routerLink]="'dashboard/applied-jobs'">
        <span></span>
        <span>Applied Jobs</span>
      </a>
    </li>
    <li class="profile-dropdown-menu-item">
      <a [routerLink]="'settings'">
        Settings
      </a>
    </li>
  </ul>
</div>
